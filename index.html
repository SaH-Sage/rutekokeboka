<style>
/* Layout: a small recipe site. Home lists the recipes by category, each with a miniature of its grid.
   A recipe is a table: ingredients down the left, steps flowing right as merged cells, only as wide as its text. */
:root {
  --bg: #F1F4F6;          /* porcelain */
  --paper: #FFFFFF;
  --ink: #1D2935;
  --muted: #5A6774;
  --rule: #C3CDD7;
  --band: #25496D;
  --band-ink: #F4F7FA;
  --dough: #F4E6C8;       /* main path */
  --prep: #E1EBF4;        /* side prep */
  --crust: #D39A3F;       /* the finish */
  --crust-ink: #24180A;
  --focus: #2F6FB0;

  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;

  --step-w: 5.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48;
    --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41;
    --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48;
  --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41;
  --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6;
  color-scheme: dark;
}
/* Palettes picked with the theme switch override the system/host theme */
html:root[data-skin="parchment"] { --bg: #EADCBF; --paper: #F8F0DE; --ink: #3A2A1B; --muted: #6E5640; --rule: #CBB590; --band: #6A3E21; --band-ink: #FBF3E3; --dough: #EED49F; --prep: #DFE3C6; --crust: #C8893A; --crust-ink: #2A1A08; --focus: #8A4B1F; color-scheme: light; }
html:root[data-skin="porcelain"] { --bg: #F1F4F6; --paper: #FFFFFF; --ink: #1D2935; --muted: #5A6774; --rule: #C3CDD7; --band: #25496D; --band-ink: #F4F7FA; --dough: #F4E6C8; --prep: #E1EBF4; --crust: #D39A3F; --crust-ink: #24180A; --focus: #2F6FB0; color-scheme: light; }
html:root[data-skin="dark"] { --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48; --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41; --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6; color-scheme: dark; }

html, body { height: 100%; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.4 var(--f-body);
  padding-block: 1rem 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:where(.brand, .back, .entry, .pager button) {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  text-align: left; cursor: pointer;
}
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page {
  display: grid;
  grid-template-columns: minmax(0, auto);
  gap: 1rem;
  width: fit-content;
  max-width: 100%;
  margin-inline: auto;
}
.page.is-home { width: min(100%, 66rem); }

/* Site bar */
.site-top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: .6rem 1.25rem; padding-bottom: .8rem; border-bottom: 1px solid var(--rule);
}
.brand {
  display: inline-flex; align-items: center; gap: .55rem;
  text-decoration: none; font: 700 1.3rem/1 var(--f-display); letter-spacing: -.01em;
}
.logo {
  display: grid; grid-template-columns: repeat(3, .7rem); grid-template-rows: repeat(3, .7rem);
  gap: 2px; padding: 2px; background: var(--rule); border-radius: 3px;
}
.logo i { background: var(--paper); }
.logo i.m { background: var(--dough); }
.logo i.p { background: var(--prep); }
.logo i.f { background: var(--crust); }
.brand-text { display: grid; gap: .2rem; }
.slogan { font: 500 .92rem/1.2 var(--f-display); letter-spacing: 0; color: var(--muted); }
.settings { display: flex; flex-wrap: wrap; gap: .5rem; }
.seg {
  display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper);
}
.seg button {
  font: 700 .85rem/1 var(--f-body); color: var(--ink);
  background: transparent; border: 0; border-radius: 999px;
  padding: .45rem .85rem; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--band); color: var(--band-ink); }

/* Home */
.intro { display: grid; gap: .4rem; }
.intro h1 { margin: 0; font: 700 2.2rem/1.05 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
.intro p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.02rem; }
.group { display: grid; gap: .8rem; }
.group h2 {
  margin: .8rem 0 0; padding-bottom: .45rem; border-bottom: 1px solid var(--rule);
  font: 700 1.45rem/1.1 var(--f-display); letter-spacing: -.01em;
}
.cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.1rem 1rem; }
.col { flex: 1 1 8rem; min-width: min(100%, 8rem); max-width: 100%; display: grid; gap: .55rem; }
.col h3 {
  margin: 0; font: 700 .78rem/1.2 var(--f-body);
  letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.season { border: 1px dashed var(--rule); border-radius: 8px; padding: .55rem .6rem; }
.season summary {
  display: flex; align-items: center; gap: .45rem; cursor: pointer; list-style: none;
  font: 700 .78rem/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.season summary::-webkit-details-marker { display: none; }
.season summary::before { content: "▸"; font-size: .95rem; letter-spacing: 0; color: var(--ink); }
.season[open] summary::before { content: "▾"; }
.season[open] summary { margin-bottom: .55rem; }
.season-list { display: flex; flex-wrap: wrap; gap: .6rem 1rem; }
.season-list li { flex: 1 1 10rem; min-width: min(100%, 9rem); }
.season summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.entry-season { font: 700 .72rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--focus); }
.toc li { display: grid; }
.entry {
  display: flex; flex-wrap: wrap; align-items: stretch; gap: .5rem .85rem;
  width: 100%; padding: .6rem;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
}
.entry .mini { flex: 1 1 6.5rem; min-width: 6.5rem; max-width: 9.5rem; height: auto; min-height: 4.8rem; }
.entry-body { flex: 3 1 9rem; min-width: min(100%, 9rem); display: flex; flex-direction: column; gap: .4rem; }
.entry:hover { border-color: var(--band); }
.entry-text { display: grid; align-content: start; gap: .2rem; min-width: 0; }
.entry-title { font: 700 1.25rem/1.1 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.entry-sub { min-width: 0; color: var(--muted); font-size: .95rem; overflow-wrap: break-word; }
.entry-meta {
  margin-top: auto; display: flex; flex-wrap: wrap; gap: .2rem 1rem;
  font: 500 .9rem/1.3 var(--f-display); font-variant-numeric: tabular-nums;
}
.entry-meta span + span { color: var(--muted); }
.mini {
  display: grid; gap: 1px; height: 6.5rem;
  background: var(--rule); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
}
.mini span { background: var(--paper); }
.mini .mh { background: var(--band); }
.mini .mi { background: var(--bg); }
.mini .main { background: var(--dough); }
.mini .prep { background: var(--prep); }
.mini .final { background: var(--crust); }

/* Recipe header */
.crumbs { display: flex; }
.back {
  display: inline-flex; align-items: center; gap: .35rem;
  font: 700 .9rem/1.2 var(--f-body); text-decoration: none; color: var(--focus);
}
.back:hover { text-decoration: underline; text-underline-offset: 2px; }
.top {
  contain: inline-size;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
  gap: .35rem 1.25rem;
}
.title-block { flex: 1 1 16rem; min-width: min(100%, 12rem); }
.top h1 {
  margin: 0;
  font: 700 2.4rem/1.05 var(--f-display);
  letter-spacing: -.015em;
  text-wrap: balance;
}
.sub { margin: .35rem 0 0; color: var(--muted); font-size: 1.05rem; }
.facts, .howto { flex: 1 1 100%; margin: 0; }
.facts {
  display: flex; flex-wrap: wrap; gap: .25rem 1.5rem;
  font: 500 .95rem/1.3 var(--f-display);
  font-variant-numeric: tabular-nums;
  margin-top: .4rem;
}
.howto {
  display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1rem;
  color: var(--muted); font-size: .88rem;
}
.key { display: inline-flex; align-items: center; gap: .4rem; }
.sw { width: .9rem; height: .9rem; border-radius: 3px; border: 1px solid var(--rule); }
.sw.main { background: var(--dough); }
.sw.prep { background: var(--prep); }
.sw.final { background: var(--crust); }

/* Batch calculator */
.controls { flex: 0 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; }
.batch { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.batch > label { font: 700 .85rem/1.2 var(--f-body); }
.stepper, .factor {
  display: inline-flex; align-items: center;
  border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper);
}
.stepper button {
  width: 2rem; height: 2rem; border: 0; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--band); color: var(--band-ink);
  font: 700 1.15rem/1 var(--f-display); cursor: pointer;
}
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper input, .factor input {
  border: 0; background: transparent; color: var(--ink);
  font: 700 1.1rem/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums;
}
.stepper input { width: 3.2rem; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.factor { padding: 2px 2px 2px .7rem; cursor: text; }
.factor span { font: 700 1rem/1 var(--f-display); color: var(--muted); }
.factor input { width: 3.4rem; height: 2rem; padding: 0 .3rem 0 .15rem; text-align: left; }
.reset {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--focus); font: 700 .85rem/1.2 var(--f-body);
  text-decoration: underline; text-underline-offset: 2px;
}

/* The sheet */
.scroll { overflow-x: auto; min-width: 0; display: grid; }
.sheet {
  display: grid;
  justify-self: start;
  align-self: start;
  width: max-content;
  grid-template-columns: auto min-content repeat(var(--cols, 9), fit-content(var(--step-w)));
  grid-template-rows: auto;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
}
.c {
  background: var(--paper);
  padding: .25em .5em;
  display: flex;
  align-items: center;
  min-width: 0;
}
.h {
  background: var(--band); color: var(--band-ink);
  justify-content: center; text-align: center;
  font: 700 .74rem/1.2 var(--f-body);
  letter-spacing: .07em; text-transform: uppercase;
}
.h.num {
  font: 700 .95rem/1.2 var(--f-display);
  letter-spacing: 0; text-transform: none;
  font-variant-numeric: tabular-nums;
}
.amt {
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; font-weight: 700; font-variant-numeric: tabular-nums;
  white-space: nowrap; line-height: 1.15;
}
.amt small { font-weight: 400; font-size: .8rem; color: var(--muted); }
.amt .free { font-weight: 400; color: var(--muted); }
.ing { white-space: pre-line; line-height: 1.2; justify-content: center; text-align: center; }
.step {
  flex-direction: column; justify-content: center; align-items: center; gap: .15rem;
  text-align: center; line-height: 1.25; text-wrap: balance; hyphens: manual;
}
.step.main { background: var(--dough); }
.step.prep { background: var(--prep); }
.step.final { background: var(--crust); color: var(--crust-ink); font-weight: 700; font-size: 1.02rem; }
.tag {
  font: 700 .82rem/1.25 var(--f-display);
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  opacity: .82;
}
.empty { background: var(--paper); }
.opt { font-style: italic; color: var(--muted); }
.pre { font-style: italic; font-size: .85rem; line-height: 1.2; color: var(--muted); margin-bottom: .15rem; }

/* Tips */
.tips { contain: inline-size; }
.tips h2 { margin: 0 0 .4rem; font: 700 1.05rem/1.2 var(--f-display); }
.tips ul {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: .45rem 2rem;
}
.tips li { flex: 1 1 22rem; min-width: min(100%, 14rem); max-width: 62ch; font-size: .92rem; }
.tips b { font-weight: 700; }

/* Previous / next */
.pager {
  contain: inline-size;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 1rem;
  padding-top: .8rem; border-top: 1px solid var(--rule);
}
.pager button { display: grid; gap: .1rem; }
.pager button:last-child { text-align: right; margin-left: auto; }
.pager small { font: 700 .72rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pager span { font: 700 1.05rem/1.2 var(--f-display); }
.pager button:hover span { text-decoration: underline; text-underline-offset: 3px; }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  :root:not(#x), :root[data-theme]:not(#x) {
    --bg: #FFFFFF; --paper: #FFFFFF; --ink: #1D2935; --muted: #4E5B68; --rule: #9FAEBC;
    --band: #25496D; --band-ink: #FFFFFF; --dough: #F4E6C8; --prep: #E1EBF4;
    --crust: #D39A3F; --crust-ink: #24180A;
    color-scheme: light;
  }
  html { font-size: 10.5pt; }
  body { padding: 0; font-size: 10.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .site-top, .crumbs, .controls, .pager { display: none; }
  .page { width: 100%; gap: 3mm; }
  .scroll { overflow: visible; }
  .sheet { width: 100%; grid-template-columns: auto min-content repeat(var(--cols, 9), 1fr) !important; break-inside: avoid; }
  .top h1 { font-size: 22pt; }
}

@media (prefers-reduced-motion: no-preference) {
  .seg button, .entry { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
}
</style>

  {
    id: "vafler", cat: "bake", group: "cakes",
    yield: { base: 10, step: 2 },
    ing: [
      { kind: "count", v: 4, no: "egg", en: ["egg", "eggs"] },
      { kind: "tbsp", v: 5, no: "sukker", en: "sugar" },
      { kind: "liquid", ml: 500, no: "hvetemel", en: "all-⁠purpose flour" },

      { kind: "liquid", ml: 500, no: "melk", en: "milk" },
      { kind: "g", g: 100, perCup: 227, no: "smør", en: "butter" },
      { kind: "text", key: "taste", optional: true, no: "rømme og syltetøy (til servering)", en: "jam and sour cream (to serve)" }

const BY_ID = Object.fromEntries(RECIPES.map((r) => [r.id, r]));

  { cat: "bake", groups: ["cakes", "yeast"] },
  { cat: "dinner", groups: ["stews", "pan"] }
];
const SEQUENCE = LAYOUT.flatMap((c) => c.groups
  .flatMap((g) => RECIPES.filter((r) => r.group === g && !r.season))
  .concat(RECIPES.filter((r) => r.cat === c.cat && r.season)));

/* ---------- amounts ---------- */
const FRACS = [[0, ""], [1 / 4, "¼"], [1 / 3, "⅓"], [1 / 2, "½"], [2 / 3, "⅔"], [3 / 4, "¾"], [1, ""]];

function nearestFrac(x, thirds) {
  const opts = thirds ? FRACS : FRACS.filter(([v]) => v !== 1 / 3 && v !== 2 / 3);
  let whole = Math.floor(x);
  const r = x - whole;
  let best = opts[0];
  for (const o of opts) if (Math.abs(o[0] - r) < Math.abs(best[0] - r)) best = o;
  if (best[0] === 1) { whole += 1; best = FRACS[0]; }
  const text = (whole > 0 || !best[1]) ? String(whole) + best[1] : best[1];
  return { value: whole + best[0], text };
}
const QUARTER = { value: 0.25, text: "¼" };
function spoon(x) { const q = nearestFrac(x, false); return q.value < 0.25 ? QUARTER : q; }
function cup(x) { const q = nearestFrac(x, true); return q.value < 0.25 ? QUARTER : q; }
function unitLabel(values, toQ, one, many) {
  const qs = values.map(toQ);
  return qs.map((q) => q.text).join("–") + NB + (qs[qs.length - 1].value > 1 ? many : one);
}
function roundG(x) { return Math.max(1, x < 30 ? Math.round(x) : Math.round(x / 5) * 5); }
function grams(x) { return roundG(x) + NB + "g"; }
function dec(x, L) { return String(x).replace(".", L.decimal); }
function liters(ml, L) { return dec(Math.round(ml / 250) / 4, L) + NB + "l"; }

function amount(spec, f, L) {
  switch (spec.kind) {
    case "liquid": {
      const ml = spec.ml * f;
      if (L.lang === "nb") {
        if (ml >= 1000) return { main: liters(ml, L) };
        const dl = ml / 100, step = dl < 3 ? 0.25 : 0.5;
        return { main: dec(Math.max(step, Math.round(dl / step) * step), L) + NB + "dl" };
      }
      const alt = unitLabel([ml / 240], cup, "cup", "cups");
      if (ml >= 1000) return { main: liters(ml, L), alt };
      const unit = ml < 200 ? 5 : 25;
      return { main: Math.max(unit, Math.round(ml / unit) * unit) + NB + "ml", alt };
    }
    case "g": {
      const gs = [].concat(spec.g).map((g) => g * f);
      const main = spec.kg && gs[0] >= 1000
        ? gs.map((g) => dec(Math.round(g / 100) / 10, L)).join("–") + NB + "kg"
        : gs.map(roundG).join("–") + NB + "g";
      let alt = null;
      if (L.lang === "en" && spec.perCup) alt = unitLabel(gs.map((g) => g / spec.perCup), cup, "cup", "cups");
      if (L.lang === "en" && spec.perLb) alt = unitLabel(gs.map((g) => g / 453.6), spoon, "lb", "lb");
      return { main, alt };
    }
    case "g1": {
      const v = Math.max(0.1, Math.round(spec.g * f * 10) / 10);
      return { main: dec(v, L) + NB + "g" };
    }
    case "tsp":
    case "tbsp": {
      const vs = [].concat(spec.v).map((v) => spoon(v * f).text);
      return { main: vs.join("–") + NB + L.u[spec.kind] };
    }
    case "count": {
      if (spec.half) {
        const h = Math.max(0.5, Math.round(spec.v * f * 2) / 2);
        const whole = Math.floor(h);
        return { main: (whole ? String(whole) : "") + (h % 1 ? "½" : ""), value: h };
      }
      const v = Math.max(1, Math.round(spec.v * f));
      return { main: String(v), value: v };
    }
    default:
      return { main: L[spec.key], free: true };
  }
}

/* Keep numbers with their units, and "ca."/"about" with their numbers. */
const GLUE_NUM = /([\d½¼¾⅓⅔]) (?=(?:°|×|kg\b|g\b|dl\b|ml\b|l\b|min\b|cm\b|timer\b|time\b|t\b|h\b|hours?\b|ts\b|ss\b|tsp\b|tbsp\b|lb\b|in\b))/g;
const GLUE_PRE = /(\b[Cc]a\.|\b[Aa]bout|≈|Ø) (?=[\d½])/g;
function glue(s) { return s.replace(GLUE_NUM, "$1" + NB).replace(GLUE_PRE, "$1" + NB); }
function fill(str, vars) {
  return glue(str
    .replace(/\{(\w+)\|([^|{}]*)\|([^{}]*)\}/g, (m, k, one, many) => (vars[k] === "1" ? one : many))
    .replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)));
}
function tr(x, lang) { return typeof x === "string" ? x : x[lang]; }

/* ---------- state ---------- */
const state = { lang: "no", skin: "parchment", route: "home", f: {}, seasonOpen: false };
const SKINS = ["parchment", "porcelain", "dark"];
const MIN_F = 0.1, MAX_F = 10;
const $ = (id) => document.getElementById(id);

function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function save(key, value) { try { localStorage.setItem(key, String(value)); } catch (e) {} }

function factorOf(r) { return state.f[r.id] || 1; }
function countOf(r, f) { return Math.max(1, Math.round(r.yield.base * f)); }
function maxCol(r) { return r.steps.reduce((m, s) => Math.max(m, s.col), 0); }
function fmtFactor(f, L) { return dec(Math.round(f * 100) / 100, L); }

function setFactor(r, f) {
  state.f[r.id] = Math.min(MAX_F, Math.max(MIN_F, f));
  save("rk-f-" + r.id, state.f[r.id]);
  render();
}

/* ---------- rendering ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function place(node, col, rowStart, rowEnd) {
  node.style.gridColumn = String(col);
  node.style.gridRow = rowStart + " / " + (rowEnd + 1);
  return node;
}

// Lay out step cells plus blank cells, for both the full sheet and the miniatures.
function stepCells(r, makeStep) {
  const cols = maxCol(r);
  const used = r.ing.map(() => Array(cols + 1).fill(false));
  const cells = r.steps.map((s) => {
    for (let i = s.from; i <= s.to; i++) used[i][s.col] = true;
    return place(makeStep(s), 2 + s.col, 2 + s.from, 2 + s.to);
  });
  used.forEach((row, i) => {
    for (let c = 1; c <= cols; c++) if (!row[c]) cells.push(place(el("span", "c empty"), 2 + c, 2 + i, 2 + i));
  });
  return cells;
}

function miniGrid(r) {
  const cols = maxCol(r);
  const g = el("span", "mini");
  g.setAttribute("aria-hidden", "true");
  g.style.gridTemplateColumns = "1.5fr repeat(" + cols + ", 1fr)";
  g.style.gridTemplateRows = ".5fr repeat(" + r.ing.length + ", 1fr)";
  const head = el("span", "mh");
  head.style.gridColumn = "1 / -1";
  head.style.gridRow = "1";
  const cells = [head];
  r.ing.forEach((_, i) => cells.push(place(el("span", "mi"), 1, 2 + i, 2 + i)));
  cells.push(...stepCells(r, (s) => el("span", s.kind)));
  cells.forEach((c) => c.classList.remove("c", "empty"));
  g.append(...cells);
  return g;
}

function renderChrome(L) {
  document.documentElement.lang = L.lang;
  document.documentElement.dataset.skin = state.skin;
  $("slogan").textContent = L.slogan;
  $("theme-group").setAttribute("aria-label", L.themeLabel);
  document.querySelectorAll("button[data-skin]").forEach((b) => {
    b.textContent = L.themes[b.dataset.skin];
    b.setAttribute("aria-pressed", String(b.dataset.skin === state.skin));
  });
  document.querySelectorAll("button[data-lang]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
  });
}

function entryCard(r) {
  const R = r[state.lang];
  const card = el("button", "entry");
  card.type = "button";
  card.dataset.route = r.id;
  const text = el("span", "entry-text");
  if (r.season) text.append(el("span", "entry-season", r.season[state.lang]));
  text.append(el("span", "entry-title", R.title), el("span", "entry-sub", R.sub));
  const meta = el("span", "entry-meta");
  meta.append(el("span", null, glue(r.yield.base + " " + R.unit)), el("span", null, glue(R.time)));
  const body = el("span", "entry-body");
  body.append(text, meta);
  card.append(miniGrid(r), body);
  const li = el("li");
  li.append(card);
  return li;
}

function renderHome(L) {
  $("intro-title").textContent = L.introTitle;
  $("intro-text").textContent = L.intro;
  const sections = LAYOUT.map(({ cat, groups }) => {
    const sec = el("section", "group");
    sec.append(el("h2", null, L.cats[cat]));
    const cols = el("div", "cols");
    groups.forEach((g) => {
      const col = el("div", "col");
      const ul = el("ul", "toc");
      ul.append(...RECIPES.filter((r) => r.group === g && !r.season).map(entryCard));
      col.append(el("h3", null, L.groups[g]), ul);
      cols.append(col);
    });
    sec.append(cols);
    const seasonal = RECIPES.filter((r) => r.cat === cat && r.season);
    if (seasonal.length) {
      const box = el("details", "season");
      box.open = state.seasonOpen;
      box.addEventListener("toggle", () => {
        state.seasonOpen = box.open;
        save("rk-season", box.open ? "1" : "0");
      });
      const list = el("ul", "toc season-list");
      list.append(...seasonal.map(entryCard));
      box.append(el("summary", null, L.seasonTitle + " (" + seasonal.length + ")"), list);
      sec.append(box);
    }
    return sec;
  });
  $("groups").replaceChildren(...sections);
  document.title = "Rutekokeboka";
}

function renderRecipe(r, L) {
  const lang = state.lang;
  const R = r[lang];
  const f = factorOf(r);
  const n = countOf(r, f);
  const vars = Object.assign({ n: String(n), base: String(r.yield.base) }, r.vars ? r.vars(f, L) : {});
  const cols = maxCol(r);

  $("back-text").textContent = L.back;
  $("title").textContent = R.title;
  $("sub").textContent = R.sub;
  $("facts").replaceChildren(...R.facts.map((t) => el("span", null, fill(t, vars))));

  const howto = $("howto");
  howto.replaceChildren(el("span", null, L.howto));
  [["main", R.main], ["prep", L.legend[0]], ["final", L.legend[1]]].forEach(([k, label]) => {
    const key = el("span", "key");
    key.append(el("span", "sw " + k), el("span", null, label));
    howto.append(key);
  });

  // Batch calculator
  const step = r.yield.step, maxN = r.yield.base * MAX_F;
  $("batch-label").textContent = R.count;
  $("batch-minus").setAttribute("aria-label", L.fewer + " " + R.unit);
  $("batch-plus").setAttribute("aria-label", L.more + " " + R.unit);
  $("batch-minus").disabled = n <= step;
  $("batch-plus").disabled = n >= maxN;
  $("batch-n").max = String(maxN);
  $("batch-f").setAttribute("aria-label", L.factor);
  $("batch-reset").textContent = fill(L.reset, vars);
  $("batch-reset").hidden = Math.abs(f - 1) < 1e-9;
  if (document.activeElement !== $("batch-n")) $("batch-n").value = String(n);
  if (document.activeElement !== $("batch-f")) $("batch-f").value = fmtFactor(f, L);

  // Sheet
  const sheet = $("sheet");
  sheet.setAttribute("aria-label", R.title);
  sheet.style.setProperty("--cols", String(cols));
  const widths = Array.from({ length: cols }, () => "var(--step-w)");
  r.steps.forEach((s) => { if (s.w) widths[s.col - 1] = s.w; });
  sheet.style.gridTemplateColumns = "auto min-content " + widths.map((w) => "fit-content(" + w + ")").join(" ");
  const cells = [
    place(el("div", "c h", L.head[0]), 1, 1, 1),
    place(el("div", "c h", L.head[1]), 2, 1, 1)
  ];
  for (let i = 1; i <= cols; i++) {
    const h = place(el("div", "c h num", String(i)), 2 + i, 1, 1);
    h.setAttribute("aria-label", L.stepLabel + " " + i);
    cells.push(h);
  }
  r.ing.forEach((spec, i) => {
    const row = 2 + i;
    const a = amount(spec, f, L);
    let name = spec[lang];
    if (Array.isArray(name)) name = a.value > 1 ? name[1] : name[0];
    const amt = el("div", "c amt" + (spec.optional ? " opt" : ""));
    amt.append(el("span", a.free ? "free" : null, a.main));
    if (a.alt) amt.append(el("small", null, a.alt));
    cells.push(place(amt, 1, row, row));
    // one word per line, but words in parentheses stay together
    cells.push(place(el("div", "c ing" + (spec.optional ? " opt" : ""), name.replace(/ (?![^(]*\))/g, "\n").replace(/ /g, NB)), 2, row, row));
  });
  cells.push(...stepCells(r, (s) => {
    const node = el("div", "c step " + s.kind);
    if (s.pre) node.append(el("span", "pre", fill(tr(s.pre, lang), vars)));
    node.append(el("span", null, fill(s[lang], vars)));
    (s.tags || []).forEach((t) => node.append(el("span", "tag", fill(tr(t, lang), vars))));
    return node;
  }));
  sheet.replaceChildren(...cells);

  $("tips-title").textContent = L.tipsTitle;
  $("tips").replaceChildren(...R.tips.map(([label, text]) => {
    const li = el("li");
    li.append(el("b", null, label), document.createTextNode(" " + fill(text, vars)));
    return li;
  }));

  // Previous / next
  const idx = SEQUENCE.indexOf(r);
  const links = [];
  [[idx - 1, L.prev, "← "], [idx + 1, L.next, ""]].forEach(([j, label, arrow]) => {
    const other = SEQUENCE[j];
    if (!other) return;
    const a = el("button");
    a.type = "button";
    a.dataset.route = other.id;
    a.append(el("small", null, label), el("span", null, arrow + other[lang].title + (arrow ? "" : " →")));
    links.push(a);
  });
  $("pager").replaceChildren(...links);
  document.title = R.title + " · Rutekokeboka";
}

function render() {
  const L = UI[state.lang];
  renderChrome(L);
  const r = BY_ID[state.route];
  $("home").hidden = !!r;
  $("recipe").hidden = !r;
  $("page").classList.toggle("is-home", !r);
  if (r) renderRecipe(r, L); else renderHome(L);
}

/* ---------- start-up ---------- */
function routeFromHash() {
  let h = "";
  try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (e) {}
  if (h === "no" || h === "en") { state.lang = h; return "home"; }
  return BY_ID[h] ? h : "home";
}

const savedLang = load("rk-lang") || load("hveteboller-lang");
if (savedLang === "no" || savedLang === "en") state.lang = savedLang;
const savedSkin = load("rk-skin") || load("hveteboller-skin");
if (SKINS.includes(savedSkin)) {
  state.skin = savedSkin;
} else {
  const hostTheme = document.documentElement.getAttribute("data-theme");
  const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  state.skin = hostTheme === "dark" || (!hostTheme && systemDark) ? "dark" : "parchment";
}
state.seasonOpen = load("rk-season") === "1";
RECIPES.forEach((r) => {
  const saved = parseFloat(load("rk-f-" + r.id));
  if (saved >= MIN_F && saved <= MAX_F) state.f[r.id] = saved;
});
if (!state.f.hveteboller) {
  const oldBuns = parseInt(load("hveteboller-buns"), 10);
  if (oldBuns >= 1 && oldBuns <= 200) state.f.hveteboller = oldBuns / 20;
}
state.route = routeFromHash();

function go(route) {
  state.route = BY_ID[route] ? route : "home";
  render();
  window.scrollTo(0, 0);
  try {
    history.replaceState(null, "", state.route === "home" ? location.pathname + location.search : "#" + state.route);
  } catch (err) {}
}
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-route]");
  if (!target) return;
  e.preventDefault();
  go(target.dataset.route);
});

window.addEventListener("hashchange", () => {
  state.route = routeFromHash();
  render();
  window.scrollTo(0, 0);
});

document.querySelectorAll("button[data-lang]").forEach((b) => {
  b.addEventListener("click", () => {
    state.lang = b.dataset.lang;
    save("rk-lang", state.lang);
    render();
  });
});
document.querySelectorAll("button[data-skin]").forEach((b) => {
  b.addEventListener("click", () => {
    state.skin = b.dataset.skin;
    save("rk-skin", state.skin);
    render();
  });
});

function current() { return BY_ID[state.route]; }

$("batch-minus").addEventListener("click", () => {
  const r = current(); if (!r) return;
  const step = r.yield.step, n = countOf(r, factorOf(r));
  if (n > step) setFactor(r, (n - (n % step || step)) / r.yield.base);
});
$("batch-plus").addEventListener("click", () => {
  const r = current(); if (!r) return;
  const step = r.yield.step, n = countOf(r, factorOf(r));
  setFactor(r, (n + (step - (n % step))) / r.yield.base);
});
$("batch-reset").addEventListener("click", () => { const r = current(); if (r) setFactor(r, 1); });

$("batch-n").addEventListener("input", (e) => {
  const r = current(); if (!r) return;
  const v = parseInt(e.target.value, 10);
  if (v >= 1 && v <= r.yield.base * MAX_F) setFactor(r, v / r.yield.base);
});
$("batch-f").addEventListener("input", (e) => {
  const r = current(); if (!r) return;
  const v = parseFloat(e.target.value.replace(",", "."));
  if (v >= MIN_F && v <= MAX_F) setFactor(r, v);
});
["change", "blur"].forEach((type) => {
  $("batch-n").addEventListener(type, render);
  $("batch-f").addEventListener(type, () => {
    const r = current();
    if (r) $("batch-f").value = fmtFactor(factorOf(r), UI[state.lang]);
  });
});
$("batch-f").addEventListener("keydown", (e) => {
  if (e.key === "Enter") e.target.blur();
});

render();
</script>
