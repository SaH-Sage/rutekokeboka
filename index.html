
<title>Rutekokeboka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: a small recipe site. Home lists the recipes by category, each with a miniature of its grid.
   A recipe is a table: ingredients down the left, steps flowing right as merged cells, only as wide as its text. */
:root {
  --bg: #F1F4F6;          /* porcelain */
  --paper: #FFFFFF;
  --ink: #1D2935;
  --muted: #5A6774;
  --rule: #C3CDD7;
  --band: #25496D;
  --band-ink: #F4F7FA;
  --dough: #F4E6C8;       /* main path */
  --prep: #E1EBF4;        /* side prep */
  --crust: #D39A3F;       /* the finish */
  --crust-ink: #24180A;
  --focus: #2F6FB0;

  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;

  --step-w: 5.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48;
    --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41;
    --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48;
  --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41;
  --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6;
  color-scheme: dark;
}
/* Palettes picked with the theme switch override the system/host theme */
html:root[data-skin="parchment"] { --bg: #EADCBF; --paper: #F8F0DE; --ink: #3A2A1B; --muted: #6E5640; --rule: #CBB590; --band: #6A3E21; --band-ink: #FBF3E3; --dough: #EED49F; --prep: #DFE3C6; --crust: #C8893A; --crust-ink: #2A1A08; --focus: #8A4B1F; color-scheme: light; }
html:root[data-skin="porcelain"] { --bg: #F1F4F6; --paper: #FFFFFF; --ink: #1D2935; --muted: #5A6774; --rule: #C3CDD7; --band: #25496D; --band-ink: #F4F7FA; --dough: #F4E6C8; --prep: #E1EBF4; --crust: #D39A3F; --crust-ink: #24180A; --focus: #2F6FB0; color-scheme: light; }
html:root[data-skin="arcade"] { --bg: #07041A; --paper: #120A33; --ink: #F3EEFF; --muted: #A99CDC; --rule: #3C2A85; --band: #FF2E9A; --band-ink: #0B0420; --dough: #1F2C6B; --prep: #0D4545; --crust: #FFE44D; --crust-ink: #1A1400; --focus: #3EF2FF; color-scheme: dark; }
html:root[data-skin="dark"] { --bg: #11171E; --paper: #18212B; --ink: #E4EAF0; --muted: #9BA8B5; --rule: #2D3A48; --band: #203C5A; --band-ink: #EAF1F8; --dough: #3A3122; --prep: #1D2F41; --crust: #C98C33; --crust-ink: #1B1206; --focus: #7FB0E6; color-scheme: dark; }

html, body { height: 100%; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.4 var(--f-body);
  padding-block: 1rem 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:where(.brand, .back, .entry, .pager button) {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  text-align: left; cursor: pointer;
}
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page {
  display: grid;
  grid-template-columns: minmax(0, auto);
  gap: 1rem;
  width: fit-content;
  max-width: 100%;
  margin-inline: auto;
}
.page.is-home { width: min(100%, 126rem); }

/* Site bar */
.site-top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: .6rem 1.25rem; padding-bottom: .8rem; border-bottom: 1px solid var(--rule);
}
.brand {
  display: inline-flex; align-items: center; gap: .55rem;
  text-decoration: none; font: 700 1.3rem/1 var(--f-display); letter-spacing: -.01em;
}
.logo {
  display: grid; grid-template-columns: repeat(3, .7rem); grid-template-rows: repeat(3, .7rem);
  gap: 2px; padding: 2px; background: var(--rule); border-radius: 3px;
}
.logo i { background: var(--paper); }
.logo i.m { background: var(--dough); }
.logo i.p { background: var(--prep); }
.logo i.f { background: var(--crust); }
.brand-text { display: grid; gap: .2rem; }
.slogan { font: 500 .92rem/1.2 var(--f-display); letter-spacing: 0; color: var(--muted); }
.settings { display: flex; flex-wrap: wrap; gap: .5rem; }
.seg {
  display: inline-flex; flex-wrap: wrap; max-width: 100%;
  border: 1px solid var(--rule); border-radius: 1.15rem; padding: 2px; background: var(--paper);
}
.seg button {
  font: 700 .85rem/1 var(--f-body); color: var(--ink);
  background: transparent; border: 0; border-radius: 999px;
  padding: .45rem .85rem; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--band); color: var(--band-ink); }

/* Home */
.intro { display: grid; gap: .4rem; }
.intro h1 { margin: 0; font: 700 2.2rem/1.05 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
.intro p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.02rem; }
.group { display: grid; gap: .8rem; }
/* Category headings stick to the top while their own section is on screen; the next
   section's heading pushes the previous one away, so only one is ever at the top. */
.group h2 {
  position: sticky; top: 0; z-index: 5;
  margin: .8rem 0 0; padding: .45rem 0; border-bottom: 1px solid var(--rule);
  background: var(--bg);
  font: 700 1.45rem/1.1 var(--f-display); letter-spacing: -.01em;
}
.cat-toggle {
  display: flex; align-items: center; gap: .5rem; width: 100%;
  font: inherit; letter-spacing: inherit; color: inherit; text-align: left;
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
}
.cat-toggle::before { content: "▾"; font-size: .8em; width: 1em; color: var(--muted); }
.cat-toggle[aria-expanded="false"]::before { content: "▸"; }
.cat-toggle .count { margin-left: auto; font: 700 .78rem/1 var(--f-body); letter-spacing: .06em; color: var(--muted); }
.cat-toggle:hover .label { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.group-body { display: grid; gap: .8rem; }
.group-body[hidden] { display: none; }
.cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.1rem 1rem; }
.col { flex: 1 1 8rem; min-width: min(100%, 8rem); max-width: 100%; display: grid; gap: .55rem; }
/* the second column grows twice as fast, so it splits into two card columns first */
.col + .col { flex-grow: 2; }
/* Balanced split (set from script): the category holds T card columns in total,
   the right column gets ceil(T/2) and the left floor(T/2), so the order is
   1+1, 1+2, 2+2, 2+3 … Basis (k-1)·gap + grow k keeps every card the same width. */
.cols.is-split { flex-wrap: nowrap; gap: 1.1rem 1.6rem; }
/* vertical rule between the two columns, centred in the gap */
.col + .col { position: relative; }
.col + .col::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: -.8rem; width: 1px;
  background: var(--rule); pointer-events: none;
}
.cols.is-split .col { flex: var(--k) 1 calc((var(--k) - 1) * .6rem); min-width: 0; }
.cols.is-split .toc { display: grid; grid-template-columns: repeat(var(--k), minmax(0, 1fr)); gap: .6rem; }
.cols.is-split .toc li { min-width: 0; max-width: none; }
.col h3 {
  margin: 0; font: 700 .78rem/1.2 var(--f-body);
  letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .6rem; }
.season { border: 1px dashed var(--rule); border-radius: 8px; padding: .55rem .6rem; }
.season summary {
  display: flex; align-items: center; gap: .45rem; cursor: pointer; list-style: none;
  font: 700 .78rem/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.season summary::-webkit-details-marker { display: none; }
.season summary::before { content: "▸"; font-size: .95rem; letter-spacing: 0; color: var(--ink); }
.season[open] summary::before { content: "▾"; }
.season[open] summary { margin-bottom: .55rem; }
.season-list { display: flex; flex-wrap: wrap; gap: .6rem 1rem; }

.season summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.entry-season { font: 700 .72rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--focus); }
.toc li { flex: 1 1 23.5rem; min-width: min(100%, 9rem); max-width: 34rem; display: grid; }
.entry {
  display: flex; flex-wrap: wrap; align-items: stretch; gap: .5rem .85rem;
  width: 100%; padding: .6rem;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
}
.entry-main {
  flex: 1 1 var(--main-min); min-width: min(100%, var(--main-min));
  /* Table and description: one above the other beside the photo; side by side when the
     text gets the full card width (photo above) and there is room for both. */
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr));
  grid-template-rows: 1fr; grid-auto-rows: auto; gap: .45rem .85rem;
}
.entry .mini { width: min(100%, var(--mini-w, 8rem)); height: auto; aspect-ratio: 5 / 3; }
/* The table is the same size on every card, so the cards line up. It grows (set from script)
   to the largest size that fits the free space on every card; what is left is split evenly
   above and below it. */
.mini-box { display: flex; align-items: center; min-width: 0; }
.entry-photo {
  /* Photo column (left, under the name): the picture with the yield/time strip under it. */
  flex: var(--photo-grow) 1 var(--photo-min); min-width: min(100%, var(--photo-min));
  display: flex; flex-direction: column; gap: .45rem;
}
.entry-frame {
  flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; border-radius: 6px;
  background: var(--bg); border: 1px dashed var(--rule);
  color: var(--muted); font: 500 .78rem/1.2 var(--f-body); text-align: center;
}
.entry-frame.has-photo { border: 0; background: none; }
.entry-photo .entry-meta {
  margin: 0;
  justify-content: space-between; padding: .3rem .55rem;
  background: var(--band); color: var(--band-ink); font-size: .82rem; text-align: left;
}
.entry-photo .entry-meta span + span { color: inherit; opacity: .85; }
.entry-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* The picture itself (name and strip not counted): fills the spare height and widens with the card.
   --photo-min keeps it at least square beside the text; 2:1 is the flattest it gets. */
.entry-shot { flex: 1 1 auto; aspect-ratio: 2 / 1; min-height: 0; display: grid; place-items: center; overflow: hidden; position: relative; }
.entry-shot img { position: absolute; inset: 0; }
/* tuned so the picture never gets narrower than square beside the text */
:root { --main-min: 10rem; --photo-min: 11rem; --photo-grow: 1.4; }
.entry:hover { border-color: var(--band); }
.entry-text { display: grid; align-content: start; gap: .2rem; min-width: 0; }
/* the dish's name runs across the top of the card, above the photo */
.entry > .entry-text { flex: 1 1 100%; }
.entry-title { font: 700 1.25rem/1.1 var(--f-display); letter-spacing: -.01em; text-wrap: balance; hyphens: manual; overflow-wrap: anywhere; }
.entry-sub { min-width: 0; align-self: center; color: var(--muted); font-size: .95rem; overflow-wrap: break-word; }
.entry-meta {
  margin-top: auto; padding-top: .1rem; display: flex; flex-wrap: wrap; gap: .2rem 1rem;
  font: 500 .9rem/1.3 var(--f-display); font-variant-numeric: tabular-nums;
}
.entry-meta span + span { color: var(--muted); }
.mini {
  display: grid; gap: 1px; height: 6.5rem;
  background: var(--rule); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
}
.mini span { background: var(--paper); }
.mini .mh { background: var(--band); }
.mini .mi { background: var(--bg); }
.mini .main { background: var(--dough); }
.mini .prep { background: var(--prep); }
.mini .final { background: var(--crust); }

/* Recipe header */
.crumbs { display: flex; }
.back {
  display: inline-flex; align-items: center; gap: .35rem;
  font: 700 .9rem/1.2 var(--f-body); text-decoration: none; color: var(--focus);
}
.back:hover { text-decoration: underline; text-underline-offset: 2px; }
.top {
  contain: inline-size;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
  gap: .35rem 1.25rem;
}
.title-block { flex: 1 1 16rem; min-width: min(100%, 12rem); }
.top h1 {
  margin: 0;
  font: 700 2.4rem/1.05 var(--f-display);
  letter-spacing: -.015em;
  text-wrap: balance;
}
.sub { margin: .35rem 0 0; color: var(--muted); font-size: 1.05rem; }
.facts, .howto { flex: 1 1 100%; margin: 0; }
.facts {
  display: flex; flex-wrap: wrap; gap: .25rem 1.5rem;
  font: 500 .95rem/1.3 var(--f-display);
  font-variant-numeric: tabular-nums;
  margin-top: .4rem;
}
.howto {
  display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1rem;
  color: var(--muted); font-size: .88rem;
}
.key { display: inline-flex; align-items: center; gap: .4rem; }
.sw { width: .9rem; height: .9rem; border-radius: 3px; border: 1px solid var(--rule); }
.sw.main { background: var(--dough); }
.sw.prep { background: var(--prep); }
.sw.final { background: var(--crust); }

/* Batch calculator */
/* Portions and the recipe's sliders share a grid: two per row when there is room, one on narrow screens.
   Fiskesuppe à la H: portions | butter, then flour | water. */
.controls {
  flex: 1 1 36rem; min-width: 0; max-width: 40rem;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
  align-items: start; gap: .7rem 1.6rem;
}
.controls .edit-btn { justify-self: start; align-self: end; }
.controls.has-opts .edit-btn { grid-column: 1 / -1; align-self: start; }
.controls .batch { gap: .3rem .5rem; }
.controls .batch > #batch-label { flex: 1 1 100%; }   /* name above the stepper, like the sliders */
.batch { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.batch > label { font: 700 .85rem/1.2 var(--f-body); }
.stepper, .factor {
  display: inline-flex; align-items: center;
  border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper);
}
.stepper button {
  width: 2rem; height: 2rem; border: 0; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--band); color: var(--band-ink);
  font: 700 1.15rem/1 var(--f-display); cursor: pointer;
}
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper input, .factor input {
  border: 0; background: transparent; color: var(--ink);
  font: 700 1.1rem/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums;
}
.stepper input { width: 3.2rem; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.factor { padding: 2px 2px 2px .7rem; cursor: text; }
.factor span { font: 700 1rem/1 var(--f-display); color: var(--muted); }
.factor input { width: 3.4rem; height: 2rem; padding: 0 .3rem 0 .15rem; text-align: left; }
.reset {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--focus); font: 700 .85rem/1.2 var(--f-body);
  text-decoration: underline; text-underline-offset: 2px;
}

/* The sheet */
.scroll { overflow-x: auto; min-width: 0; display: grid; }
.sheet {
  display: grid;
  justify-self: start;
  align-self: start;
  width: max-content;
  grid-template-columns: auto min-content repeat(var(--cols, 9), fit-content(var(--step-w)));
  grid-template-rows: auto;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
}
.c {
  background: var(--paper);
  padding: .25em .5em;
  display: flex;
  align-items: center;
  min-width: 0;
}
.h {
  background: var(--band); color: var(--band-ink);
  justify-content: center; text-align: center;
  font: 700 .74rem/1.2 var(--f-body);
  letter-spacing: .07em; text-transform: uppercase;
}
.h.num {
  font: 700 .95rem/1.2 var(--f-display);
  letter-spacing: 0; text-transform: none;
  font-variant-numeric: tabular-nums;
}
.amt {
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; font-weight: 700; font-variant-numeric: tabular-nums;
  white-space: nowrap; line-height: 1.15;
}
.amt small { font-weight: 400; font-size: .8rem; color: var(--muted); }
.amt .free { font-weight: 400; color: var(--muted); }
.ing { white-space: pre-line; line-height: 1.2; justify-content: center; text-align: center; }
.step {
  flex-direction: column; justify-content: center; align-items: center; gap: .15rem;
  text-align: center; line-height: 1.25; text-wrap: balance; hyphens: manual;
}
.step.main { background: var(--dough); }
.step.prep { background: var(--prep); }
.step.final { background: var(--crust); color: var(--crust-ink); font-weight: 700; font-size: 1.02rem; }
.tag {
  font: 700 .82rem/1.25 var(--f-display);
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  opacity: .82;
}
.empty { background: var(--paper); }
.opt { font-style: italic; color: var(--muted); }
.pre { font-style: italic; font-size: .85rem; line-height: 1.2; color: var(--muted); margin-bottom: .15rem; }

/* Tips */
.tips { contain: inline-size; }
.tips h2 { margin: 0 0 .4rem; font: 700 1.05rem/1.2 var(--f-display); }
.tips ul {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: .45rem 2rem;
}
.tips li { flex: 1 1 22rem; min-width: min(100%, 14rem); max-width: 62ch; font-size: .92rem; }
.tips b { font-weight: 700; }

/* Edit mode */
.edit-btn, .editbar button {
  font: 700 .85rem/1 var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 999px; padding: .5rem .9rem; cursor: pointer;
}
.edit-btn[aria-pressed="true"] { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.editbar {
  contain: inline-size;
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
  padding: .55rem .75rem; border: 1px dashed var(--band); border-radius: 6px; background: var(--paper);
  font-size: .88rem;
}
.editbar[hidden], .opt-box[hidden] { display: none; }
.editbar .hint { flex: 1 1 20rem; margin: 0; color: var(--muted); }
.edit-actions { display: flex; flex-wrap: wrap; gap: .4rem; }
.editbar .status { flex: 1 1 100%; margin: 0; font-weight: 700; color: var(--focus); }
.editbar .status:empty { display: none; }
.batch.is-off { opacity: .45; }
.sheet.editing [contenteditable] {
  cursor: text; border-radius: 2px; min-width: 1.5em;
  outline: 1px dashed color-mix(in srgb, var(--ink) 40%, transparent); outline-offset: 1px;
}
.sheet.editing [contenteditable]:focus { outline: 2px solid var(--focus); }
.sheet.editing .ing { white-space: normal; }
.c.is-edited { box-shadow: inset 3px 0 0 var(--focus); }
.amt-edit { display: inline-flex; align-items: center; gap: .25rem; }
.amt-edit input {
  width: 4rem; padding: .15rem .25rem; text-align: center;
  font: 700 .95rem/1.2 var(--f-display); font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px;
}
.amt-edit span { font-weight: 400; font-size: .85rem; color: var(--muted); }

/* Recipe option: how coarse the bread is (Brødskalaen) */
.opt-box { display: contents; }
.opt-row {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "label value" "slider slider" "note note";
  align-items: center; gap: .2rem .6rem; min-width: 0;
}
.opt-row > label { grid-area: label; font: 700 .85rem/1.2 var(--f-body); }
.opt-row .grade-value { grid-area: value; justify-self: start; }
.opt-note { grid-area: note; margin: 0; font-size: .78rem; color: var(--muted); }
.grade { grid-area: slider; display: grid; gap: .15rem; min-width: 0; }
.grade input { width: 100%; margin: 0; accent-color: var(--band); }
.grade-ticks { display: flex; justify-content: space-between; gap: .4rem; font-size: .74rem; color: var(--muted); }
.grade-ticks span[aria-current] { color: var(--ink); font-weight: 700; }
.grade-value { flex: 0 0 auto; display: inline-flex; align-items: center; gap: .4rem; font: 700 .9rem/1.2 var(--f-display); white-space: nowrap; }
.grade-stack { display: inline-grid; }
.grade-stack > span { grid-area: 1 / 1; visibility: hidden; }
.grade-stack > span.on { visibility: visible; }

/* ---------- amounts ---------- */
const FRACS = [[0, ""], [1 / 4, "¼"], [1 / 3, "⅓"], [1 / 2, "½"], [2 / 3, "⅔"], [3 / 4, "¾"], [1, ""]];

function nearestFrac(x, thirds) {
  const opts = thirds ? FRACS : FRACS.filter(([v]) => v !== 1 / 3 && v !== 2 / 3);
  let whole = Math.floor(x);
  const r = x - whole;
  let best = opts[0];
  for (const o of opts) if (Math.abs(o[0] - r) < Math.abs(best[0] - r)) best = o;
  if (best[0] === 1) { whole += 1; best = FRACS[0]; }
  const text = (whole > 0 || !best[1]) ? String(whole) + best[1] : best[1];
  return { value: whole + best[0], text };
}
const QUARTER = { value: 0.25, text: "¼" };
function spoon(x) { const q = nearestFrac(x, false); return q.value < 0.25 ? QUARTER : q; }
function cup(x) { const q = nearestFrac(x, true); return q.value < 0.25 ? QUARTER : q; }
function unitLabel(values, toQ, one, many) {
  const qs = values.map(toQ);
  return qs.map((q) => q.text).join("–") + NB + (qs[qs.length - 1].value > 1 ? many : one);
}
function roundG(x) { return Math.max(1, x < 30 ? Math.round(x) : Math.round(x / 5) * 5); }
function grams(x) { return roundG(x) + NB + "g"; }
function dec(x, L) { return String(x).replace(".", L.decimal); }
function liters(ml, L) { return dec(Math.round(ml / 250) / 4, L) + NB + "l"; }

function amount(spec, f, L) {
  switch (spec.kind) {
    case "liquid": {
      const ml = spec.ml * f;
      if (L.lang === "nb") {
        if (ml >= 1000) return { main: liters(ml, L) };
        const dl = ml / 100, step = dl < 3 ? 0.25 : 0.5;
        return { main: dec(Math.max(step, Math.round(dl / step) * step), L) + NB + "dl" };
      }
      const alt = unitLabel([ml / 240], cup, "cup", "cups");
      if (ml >= 1000) return { main: liters(ml, L), alt };
      const unit = ml < 200 ? 5 : 25;
      return { main: Math.max(unit, Math.round(ml / unit) * unit) + NB + "ml", alt };
    }
    case "g": {
      const gs = [].concat(spec.g).map((g) => g * f);
      const main = spec.kg && gs[0] >= 1000
        ? gs.map((g) => dec(Math.round(g / 100) / 10, L)).join("–") + NB + "kg"
        : gs.map(roundG).join("–") + NB + "g";
      let alt = null;
      if (L.lang === "en" && spec.perCup) alt = unitLabel(gs.map((g) => g / spec.perCup), cup, "cup", "cups");
      if (L.lang === "en" && spec.perLb) alt = unitLabel(gs.map((g) => g / 453.6), spoon, "lb", "lb");
      return { main, alt };
    }
    case "g1": {
      const v = Math.max(0.1, Math.round(spec.g * f * 10) / 10);
      return { main: dec(v, L) + NB + "g" };
    }
    case "tsp":
    case "tbsp": {
      const vs = [].concat(spec.v).map((v) => spoon(v * f).text);
      return { main: vs.join("–") + NB + L.u[spec.kind] };
    }
    case "count": {
      if (spec.half) {
        const h = Math.max(0.5, Math.round(spec.v * f * 2) / 2);
        const whole = Math.floor(h);
        return { main: (whole ? String(whole) : "") + (h % 1 ? "½" : ""), value: h };
      }
      const v = Math.max(1, Math.round(spec.v * f));
      return { main: String(v), value: v };
    }
    default:
      return { main: L[spec.key], free: true };
  }
}

/* Keep numbers with their units, and "ca."/"about" with their numbers. */
const GLUE_NUM = /([\d½¼¾⅓⅔]) (?=(?:°|×|kg\b|g\b|dl\b|ml\b|l\b|min\b|cm\b|timer\b|time\b|t\b|h\b|hours?\b|ts\b|ss\b|tsp\b|tbsp\b|lb\b|in\b))/g;
const GLUE_PRE = /(\b[Cc]a\.|\b[Aa]bout|≈|Ø) (?=[\d½])/g;
function glue(s) { return s.replace(GLUE_NUM, "$1" + NB).replace(GLUE_PRE, "$1" + NB); }

  return glue(str
    .replace(/\{(\w+)\|([^|{}]*)\|([^{}]*)\}/g, (m, k, one, many) => (vars[k] === "1" ? one : many))
    .replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)));
}
function tr(x, lang) { return typeof x === "string" ? x : x[lang]; }

/* ---------- edits made in edit mode ----------
   Kept per recipe as small overrides on top of the built-in recipe, e.g.
   { hveteboller: { "i4.no": "hvetemel (spesial)", "i4.amt": 800, "s2.no": "…", "s5.t0.no": "…" } }
   i<n> = ingredient row n (name per language, or amt = base amount in g / ml / count),
   s<n> = step n (text, pre-text, t<k> = time/temperature tag k). */
const EDIT_FORMAT = "rutekokeboka-endringer";
const AMT_FIELD = { g: "g", g1: "g", liquid: "ml", tsp: "v", tbsp: "v", count: "v" };
const EDIT_KEY = /^(i\d+\.(no|en|amt)|s\d+\.(no|en|pre\.no|pre\.en|t\d+(\.no|\.en)?))$/;
let EDITS = {};
function cleanEdits(obj) {
  const out = {};
  if (!obj || typeof obj !== "object") return out;
  Object.keys(obj).forEach((id) => {
    const rec = obj[id];
    if (!BY_ID[id] || !rec || typeof rec !== "object") return;
    const ok = {};
    Object.keys(rec).forEach((k) => {
      const v = rec[k];
      if (!EDIT_KEY.test(k)) return;
      if (k.endsWith(".amt") ? typeof v === "number" && isFinite(v) && v >= 0 && v < 1e6
                             : typeof v === "string" && v.length <= 400) ok[k] = v;
    });

  });

}
function saveEdits() { save("rk-edits", JSON.stringify(EDITS)); }
function setEdit(r, key, value) {
  const rec = EDITS[r.id] || (EDITS[r.id] = {});
  if (value == null) delete rec[key]; else rec[key] = value;
  if (!Object.keys(rec).length) delete EDITS[r.id];

// The recipe as shown: built-in data, then the coarseness choice, then the viewer's edits.
function effective(r, E) {
  E = E || EDITS[r.id] || {};
  const levels = optLevels(r);
  const ing = r.ing.map((spec, i) => {
    const c = Object.assign({}, spec);
    if (spec.byOpt) Object.assign(c, spec.byOpt(levels));
    ["no", "en"].forEach((l) => { if (E["i" + i + "." + l] != null) c[l] = E["i" + i + "." + l]; });
    const field = AMT_FIELD[c.kind];
    if (field && E["i" + i + ".amt"] != null && !Array.isArray(c[field])) c[field] = E["i" + i + ".amt"];
    return c;
  });
  const steps = r.steps.map((st, j) => {
    const c = Object.assign({}, st), p = "s" + j + ".";
    ["no", "en"].forEach((l) => { if (E[p + l] != null) c[l] = E[p + l]; });
    if (st.pre) {
      c.pre = Object.assign({}, st.pre);
      ["no", "en"].forEach((l) => { if (E[p + "pre." + l] != null) c.pre[l] = E[p + "pre." + l]; });
    }
    if (st.tags) c.tags = st.tags.map((t, k) => {
      if (typeof t === "string") return E[p + "t" + k] != null ? E[p + "t" + k] : t;
      const o = Object.assign({}, t);
      ["no", "en"].forEach((l) => { if (E[p + "t" + k + "." + l] != null) o[l] = E[p + "t" + k + "." + l]; });
      return o;

// Base value behind an edit key (no edits applied), to tell a real change from an unchanged one.
function baseValue(r, key) {
  const b = effective(r, {});

  const idx = parseInt(m[0].slice(1), 10);
  if (m[0][0] === "i") {
    const spec = b.ing[idx];
    if (m[1] === "amt") return spec[AMT_FIELD[spec.kind]];
    const v = spec[m[1]];
    return Array.isArray(v) ? null : v;
  }
  const st = b.steps[idx];
  if (m[1] === "pre") return st.pre ? st.pre[m[2]] : null;
  if (m[1][0] === "t") { const t = st.tags[parseInt(m[1].slice(1), 10)]; return typeof t === "string" ? t : t[m[2]]; }
  return st[m[1]];
}
function countOf(r, f) { return Math.max(1, Math.round(r.yield.base * f)); }
function maxCol(r) { return r.steps.reduce((m, s) => Math.max(m, s.col), 0); }
function fmtFactor(f, L) { return dec(Math.round(f * 100) / 100, L); }

function setFactor(r, f) {
  state.f[r.id] = Math.min(MAX_F, Math.max(MIN_F, f));
  save("rk-f-" + r.id, state.f[r.id]);

/* ---------- rendering ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function place(node, col, rowStart, rowEnd) {
  node.style.gridColumn = String(col);
  node.style.gridRow = rowStart + " / " + (rowEnd + 1);
  return node;
}

// Lay out step cells plus blank cells, for both the full sheet and the miniatures.
// Once a step has worked on some ingredients, they wait as ONE cell until a later step
// uses them: combined rows are merged downwards, and the waiting columns sideways.
// Ingredients no step has touched yet keep one cell per row and column.
function stepCells(r, makeStep) {
  const cols = maxCol(r), rows = r.ing.length;
  const group = r.ing.map((_, i) => "r" + i);   // rows with the same id have been combined
  const cells = [];
  const runs = [];                               // runs[c] = blank runs in column c: {i, j, g}
  for (let c = 1; c <= cols; c++) {
    const used = Array(rows).fill(false);
    const here = r.steps.filter((s) => s.col === c);
    here.forEach((s) => {
      for (let i = s.from; i <= s.to; i++) used[i] = true;
      cells.push(place(makeStep(s), 2 + c, 2 + s.from, 2 + s.to));
    });
    runs[c] = [];
    for (let i = 0; i < rows; ) {
      if (used[i]) { i++; continue; }
      let j = i;
      while (j + 1 < rows && !used[j + 1] && group[j + 1] === group[i]) j++;
      runs[c].push({ i, j, g: group[i] });
      i = j + 1;
    }
    here.forEach((s) => { const id = "s" + r.steps.indexOf(s); for (let i = s.from; i <= s.to; i++) group[i] = id; });
  }
  for (let c = 1; c <= cols; c++) {
    runs[c].forEach((run) => {
      if (run.done) return;
      let last = c;
      if (run.g[0] === "s") {   // worked on before: stretch over the following waiting columns
        for (let d = c + 1; d <= cols; d++) {
          const same = runs[d].find((x) => !x.done && x.i === run.i && x.j === run.j && x.g === run.g);
          if (!same) break;
          same.done = true;
          last = d;
        }
      }
      const cell = place(el("span", "c empty"), 2 + c, 2 + run.i, 2 + run.j);
      if (last > c) cell.style.gridColumn = (2 + c) + " / " + (3 + last);
      cells.push(cell);
    });
  }
  return cells;
}

function miniGrid(r) {
  const cols = maxCol(r);
  const g = el("span", "mini");
  g.setAttribute("aria-hidden", "true");
  g.style.gridTemplateColumns = "1.5fr repeat(" + cols + ", 1fr)";
  g.style.gridTemplateRows = ".5fr repeat(" + r.ing.length + ", 1fr)";
  const head = el("span", "mh");
  head.style.gridColumn = "1 / -1";
  head.style.gridRow = "1";
  const cells = [head];
  r.ing.forEach((_, i) => cells.push(place(el("span", "mi"), 1, 2 + i, 2 + i)));
  cells.push(...stepCells(r, (s) => el("span", s.kind)));
  cells.forEach((c) => c.classList.remove("c", "empty"));
  g.append(...cells);
  return g;
}

/* ---------- photos ----------
   Put a photo in the folder "bilder" next to this page, named after the recipe's id,
   e.g. bilder/hveteboller.jpg. The first of these endings that exists is used. */
const PHOTO_DIR = "bilder/";
const PHOTO_EXT = ["jpg", "jpeg", "webp", "png"];
const photoCache = {};
function findPhoto(r) {
  if (!photoCache[r.id]) {
    photoCache[r.id] = new Promise((resolve) => {
      const urls = (r.photo ? [r.photo] : []).concat(PHOTO_EXT.map((x) => PHOTO_DIR + r.id + "." + x));
      let i = 0;
      const next = () => {
        if (i >= urls.length) return resolve(null);
        const url = urls[i++];
        const probe = new Image();
        probe.onload = () => resolve(url);
        probe.onerror = next;
        probe.src = url;
      };
      next();
    });
  }
  return photoCache[r.id];
}

// The base yield as text. "1 loaf", not "1 loaves": with a yield of one, use the singular

function yieldLabel(r, R) {

function entryCard(r) {

    .replace(/^Frø(?=knekke)/u, "Frø\u00ad").replace(/knekke(?=brød)/u, "knekke\u00ad")
    .replace(/(\p{L}{4,})(brød|boller|snurrer|kjeks|kake)(?=\s|$)/gu, "$1\u00ad$2");
  head.append(el("span", "entry-title", shy));

  miniBox.append(miniGrid(r));
  main.append(miniBox, el("span", "entry-sub", R.sub));
  // A photo of the dish, or a placeholder until one is added, with the yield/time strip

// One card column per ~17rem of category width (at least one per side).
const CARD_UNIT = 23.5, CARD_GAP = .6, COL_GAP = 1.6;  // text side + square picture + padding
function splitCols(cols) {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const unit = CARD_UNIT * rem, gap = CARD_GAP * rem;
  const extra = (COL_GAP - CARD_GAP) * rem * (cols.children.length - 1);   // the wider gap holding the rule
  const total = Math.max(2, Math.floor((cols.clientWidth - extra + gap) / (unit + gap)));
  const list = [...cols.children];
  const left = Math.floor(total / list.length);
  let odd = total - left * list.length;   // odd one goes to the right-most column
  for (let i = list.length - 1; i >= 0; i--) {
    const k = left + (odd > 0 ? 1 : 0); if (odd > 0) odd--;
    list[i].style.setProperty("--k", String(k));
  }
  cols.classList.add("is-split");
}
// The picture is never narrower than it is tall: if a picture is given more height than
// width (card height less the name above it and the strip below it), the minimum widens. Every card on the page shares one minimum,
// set by the tallest text, so the pictures and tables line up from card to card.
function fitPhotos() {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const cards = [...document.querySelectorAll("#groups .entry")].filter((e) => e.offsetParent);
  const groupOf = (e) => e.closest(".season-list") || "main lists";  // Bakst and Middag match too
  const isStacked = (e) => Math.abs(e.querySelector(".entry-photo").offsetTop - e.querySelector(".entry-main").offsetTop) > 4;
  for (let pass = 0; pass < 6; pass++) {
    // the tallest picture (beside its text) in each group sets that group's minimum width
    const tallest = new Map();
    cards.forEach((e) => {
      if (isStacked(e)) return;
      const h = e.querySelector(".entry-shot").getBoundingClientRect().height;
      tallest.set(groupOf(e), Math.max(tallest.get(groupOf(e)) || 0, h));
    });
    // 11rem keeps the photo the dominant part of the card; taller pictures widen it to stay square
    const want = cards.map((e) => Math.max(11 * rem, Math.ceil(tallest.get(groupOf(e)) || 0)));
    let changed = false;
    cards.forEach((e, i) => {
      const cur = parseFloat(e.style.getPropertyValue("--photo-min")) || 11 * rem;
      // When the picture has dropped under the text, the text is wider and shorter than it
      // would be beside the picture, so only let the minimum grow from that measurement.
      if (isStacked(e) && want[i] < cur) return;
      if (Math.abs(cur - want[i]) > 1) { e.style.setProperty("--photo-min", want[i] + "px"); changed = true; }
    });
    if (!changed) break;
  }
}
// The tables grow together: the largest size that fits the free width and height on every
// card beside its photo (Bakst and Middag share one size, the seasonal fold-out its own).
function fitTables() {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const cards = [...document.querySelectorAll("#groups .entry")].filter((e) => e.offsetParent);
  const groupOf = (e) => e.closest(".season-list") || "main lists";
  const isStacked = (e) => Math.abs(e.querySelector(".entry-photo").offsetTop - e.querySelector(".entry-main").offsetTop) > 4;
  const room = new Map();
  cards.forEach((e) => {
    if (isStacked(e)) return;
    const main = e.querySelector(".entry-main"), box = e.querySelector(".mini-box");
    const gap = parseFloat(getComputedStyle(main).rowGap) || 0;
    const h = main.clientHeight - e.querySelector(".entry-sub").offsetHeight - gap;
    const fit = Math.min(box.clientWidth, h * 5 / 3);
    room.set(groupOf(e), Math.min(room.has(groupOf(e)) ? room.get(groupOf(e)) : Infinity, fit));
  });
  cards.forEach((e) => {
    const fit = room.get(groupOf(e));
    if (fit && fit - 2 > 8 * rem) e.style.setProperty("--mini-w", Math.floor(fit - 2) + "px");  // 2px for rounding
  });
}
function layoutCards() {
  document.querySelectorAll("#groups .entry").forEach((e) => e.style.removeProperty("--mini-w"));
  fitPhotos();
  fitTables();
}
const colObserver = typeof ResizeObserver === "function"
  ? new ResizeObserver((entries) => { entries.forEach((e) => splitCols(e.target)); layoutCards(); }) : null;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutCards());

function renderHome(L) {
  $("intro-title").textContent = L.introTitle;
  $("intro-text").textContent = L.intro;
  const sections = LAYOUT.map(({ cat, groups }) => {
    const sec = el("section", "group");
    // the heading is a button that folds the whole category away
    const open = !state.collapsed[cat];
    const h2 = el("h2");
    const toggle = el("button", "cat-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-controls", "cat-" + cat);
    toggle.append(el("span", "label", L.cats[cat]), el("span", "count", String(RECIPES.filter((r) => r.cat === cat).length)));
    h2.append(toggle);
    const body = el("div", "group-body");
    body.id = "cat-" + cat;
    body.hidden = !open;
    toggle.addEventListener("click", () => {
      const nowOpen = body.hidden;
      body.hidden = !nowOpen;
      toggle.setAttribute("aria-expanded", String(nowOpen));
      state.collapsed[cat] = !nowOpen;
      save("rk-collapsed-" + cat, nowOpen ? "0" : "1");
      if (nowOpen) layoutCards();
      // folding a section while its heading is stuck: bring the heading back into view
      const top = sec.getBoundingClientRect().top;
      if (top < 0) window.scrollBy(0, top);
    });
    sec.append(h2, body);
    const cols = el("div", "cols");
    groups.forEach((g) => {
      const col = el("div", "col");
      const ul = el("ul", "toc");
      ul.append(...RECIPES.filter((r) => r.group === g && !r.season).map(entryCard));
      col.append(el("h3", null, L.groups[g]), ul);
      cols.append(col);
    });
    body.append(cols);
    const seasonal = RECIPES.filter((r) => r.cat === cat && r.season);
    if (seasonal.length) {
      const box = el("details", "season");
      box.open = state.seasonOpen;
      box.addEventListener("toggle", () => {
        state.seasonOpen = box.open;
        if (box.open) layoutCards();
        save("rk-season", box.open ? "1" : "0");
      });
      const list = el("ul", "toc season-list");
      list.append(...seasonal.map(entryCard));
      box.append(el("summary", null, L.seasonTitle + " (" + seasonal.length + ")"), list);
      body.append(box);
    }
    return sec;
  });
  $("groups").replaceChildren(...sections);
  if (colObserver) {
    colObserver.disconnect();
    document.querySelectorAll("#groups .cols").forEach((c) => { splitCols(c); colObserver.observe(c); });
    layoutCards();
  }
  document.title = "Rutekokeboka";
}

function renderOptions(r) {
  const box = $("opt-box");
  const opts = r.options || [];
  box.parentElement.classList.toggle("has-opts", opts.length > 0);
  if (!opts.length) { box.hidden = true; box.replaceChildren(); box.dataset.key = ""; return; }
  box.hidden = false;
  const lang = state.lang;
  const key = r.id + "/" + lang;
  if (box.dataset.key !== key) {
    // built once per recipe and language, so a slider keeps working while it is dragged
    box.dataset.key = key;
    box.replaceChildren(...opts.map((o) => {
      const T = o[lang], id = "opt-" + o.key;
      const row = el("div", "opt-row");
      row.dataset.opt = o.key;
      const label = el("label", null, T.label);
      label.htmlFor = id;
      const wrap = el("div", "grade");
      const input = el("input");
      Object.assign(input, { type: "range", id, min: "0", max: String(o.levels.length - 1), step: "1" });
      input.addEventListener("input", () => {
        state.grade[r.id + ":" + o.key] = parseInt(input.value, 10);
        save("rk-g-" + r.id + "-" + o.key, input.value);
        render();
      });
      const ticks = el("div", "grade-ticks");
      T.names.forEach((nm) => ticks.append(el("span", null, nm)));
      wrap.append(input, ticks);
      // every possible value sits in the same spot, only the current one visible,
      // so the box is always as wide as the longest value and nothing jumps
      const value = el("span", "grade-value");
      const icon = el("span", "grade-icon");
      icon.setAttribute("aria-hidden", "true");
      for (let k = 0; k < o.levels.length; k++) icon.append(el("i"));
      const stack = el("span", "grade-stack");
      o.levels.forEach((lv, k) => {
        const text = T.value ? fill(T.value, Object.fromEntries(Object.entries(lv).map(([a, b]) => [a, String(b)]))) : T.names[k];
        stack.append(el("span", null, text));
      });
      value.append(icon, stack);
      row.append(label, value, wrap);
      if (T.note) row.append(el("p", "opt-note", T.note));
      return row;
    }));
  }
  opts.forEach((o) => {
    const g = optIndex(r, o), row = box.querySelector('[data-opt="' + o.key + '"]');
    const input = row.querySelector("input");
    if (document.activeElement !== input) input.value = String(g);
    input.setAttribute("aria-valuetext", o[lang].names[g]);
    row.querySelectorAll(".grade-ticks span").forEach((t, k) => { if (k === g) t.setAttribute("aria-current", "true"); else t.removeAttribute("aria-current"); });
    row.querySelectorAll(".grade-icon i").forEach((t, k) => t.classList.toggle("on", k <= g));
    row.querySelectorAll(".grade-stack span").forEach((t, k) => t.classList.toggle("on", k === g));
  });
}

function editable(node, key, text) {
  node.textContent = text;
  node.contentEditable = "plaintext-only";
  if (node.contentEditable !== "plaintext-only") node.contentEditable = "true";
  node.spellcheck = false;
  node.dataset.edit = key;
  return node;
}

function renderRecipe(r, L) {
  const lang = state.lang;
  const R = r[lang];
  const editing = state.editing;
  const f = editing ? 1 : factorOf(r);   // edit mode shows the base recipe
  const n = countOf(r, f);
  const vars = Object.assign({ n: String(n), base: String(r.yield.base) }, r.vars ? r.vars(f, L) : {});
  (r.options || []).forEach((o) => {
    const g = optIndex(r, o);
    vars[o.key + "Name"] = o[lang].names[g];
    if (o.levels[g].range) vars[o.key + "Range"] = o.levels[g].range;
  });
  const cols = maxCol(r);
  const eff = effective(r);
  const E = EDITS[r.id] || {};
  const hasEdit = (prefix) => Object.keys(E).some((k) => k.startsWith(prefix));
  renderOptions(r);

  $("back-text").textContent = L.back;
  $("title").textContent = R.title;
  $("sub").textContent = R.sub;
  $("facts").replaceChildren(...R.facts.map((t) => el("span", null, fill(t, vars))));

  const howto = $("howto");
  howto.replaceChildren(el("span", null, L.howto));
  [["main", R.main], ["prep", L.legend[0]], ["final", L.legend[1]]].forEach(([k, label]) => {
    const key = el("span", "key");
    key.append(el("span", "sw " + k), el("span", null, label));
    howto.append(key);
  });

  // Batch calculator
  const step = r.yield.step, maxN = r.yield.base * MAX_F;
  $("batch-label").textContent = R.count;
  $("batch-minus").setAttribute("aria-label", L.fewer + " " + R.unit);
  $("batch-plus").setAttribute("aria-label", L.more + " " + R.unit);
  $("batch-minus").disabled = n <= step;
  $("batch-plus").disabled = n >= maxN;
  $("batch-n").max = String(maxN);
  $("batch-f").setAttribute("aria-label", L.factor);
  $("batch-reset").textContent = fill(L.reset, vars);
  $("batch-reset").hidden = Math.abs(f - 1) < 1e-9;
  if (document.activeElement !== $("batch-n")) $("batch-n").value = String(n);
  if (document.activeElement !== $("batch-f")) $("batch-f").value = fmtFactor(f, L);
  document.querySelector(".batch").classList.toggle("is-off", editing);
  ["batch-minus", "batch-plus", "batch-n", "batch-f"].forEach((id) => { if (editing) $(id).disabled = true; });
  if (!editing) $("batch-n").disabled = $("batch-f").disabled = false;
  if (editing) $("batch-reset").hidden = true;

  // Edit mode
  $("edit-toggle").textContent = editing ? L.editDone : L.edit;
  $("edit-toggle").setAttribute("aria-pressed", String(editing));
  $("editbar").hidden = !editing;
  $("edit-hint").textContent = fill(L.editHint, { yield: yieldLabel(r, R) });
  $("edit-export").textContent = L.exportBtn;
  $("edit-import").textContent = L.importBtn;
  $("edit-reset").textContent = L.resetBtn;
  $("edit-reset").disabled = !EDITS[r.id];

  // Sheet
  const sheet = $("sheet");
  sheet.setAttribute("aria-label", R.title);
  sheet.style.setProperty("--cols", String(cols));
  const widths = Array.from({ length: cols }, () => "var(--step-w)");
  r.steps.forEach((s) => { if (s.w) widths[s.col - 1] = s.w; });
  sheet.style.gridTemplateColumns = "auto min-content " + widths.map((w) => "fit-content(" + w + ")").join(" ");
  const cells = [
    place(el("div", "c h", L.head[0]), 1, 1, 1),
    place(el("div", "c h", L.head[1]), 2, 1, 1)
  ];
  for (let i = 1; i <= cols; i++) {
    const h = place(el("div", "c h num", String(i)), 2 + i, 1, 1);
    h.setAttribute("aria-label", L.stepLabel + " " + i);
    cells.push(h);
  }
  eff.ing.forEach((spec, i) => {
    const row = 2 + i;
    const a = amount(spec, f, L);
    let name = spec[lang];
    if (Array.isArray(name)) name = a.value > 1 ? name[1] : name[0];
    const amt = el("div", "c amt" + (spec.optional ? " opt" : "") + (E["i" + i + ".amt"] != null ? " is-edited" : ""));
    const field = AMT_FIELD[spec.kind];
    if (editing && field && !Array.isArray(spec[field])) {
      // the base amount in a plain unit: g, dl (Norwegian) or ml (English), spoons or a count
      const scale = spec.kind === "liquid" && lang === "no" ? 100 : 1;
      const unit = spec.kind === "liquid" ? (scale === 100 ? "dl" : "ml") : spec.kind === "count" ? "" : spec.kind === "g" || spec.kind === "g1" ? "g" : L.u[spec.kind];
      const box = el("label", "amt-edit");
      const input = el("input");
      input.type = "text";
      input.inputMode = "decimal";
      input.value = dec(Math.round(spec[field] / scale * 100) / 100, L);
      input.dataset.edit = "i" + i + ".amt";
      input.dataset.scale = String(scale);
      input.setAttribute("aria-label", L.head[0] + ": " + name);
      box.append(input);
      if (unit) box.append(el("span", null, unit));
      amt.append(box);
    } else {
      amt.append(el("span", a.free ? "free" : null, a.main));
      if (a.alt) amt.append(el("small", null, a.alt));
    }
    cells.push(place(amt, 1, row, row));
    const ingCell = el("div", "c ing" + (spec.optional ? " opt" : "") + (E["i" + i + "." + lang] != null ? " is-edited" : ""));
    if (editing) editable(ingCell, "i" + i + "." + lang, name);
    // one word per line, but words in parentheses stay together
    else ingCell.textContent = name.replace(/ (?![^(]*\))/g, "\n").replace(/ /g, NB);
    cells.push(place(ingCell, 2, row, row));
  });
  cells.push(...stepCells(r, (s0) => {
    const j = r.steps.indexOf(s0), s = eff.steps[j], p = "s" + j + ".";
    const node = el("div", "c step " + s.kind + (hasEdit(p) ? " is-edited" : ""));
    if (editing) {
      // raw text, with {placeholders} visible, so nothing gets frozen to one batch size
      if (s.pre) node.append(editable(el("span", "pre"), p + "pre." + lang, tr(s.pre, lang)));
      node.append(editable(el("span"), p + lang, s[lang]));
      (s.tags || []).forEach((t, k) => node.append(editable(el("span", "tag"), p + "t" + k + (typeof t === "string" ? "" : "." + lang), tr(t, lang))));
    } else {
      if (s.pre) node.append(el("span", "pre", fill(tr(s.pre, lang), vars)));
      node.append(el("span", null, fill(s[lang], vars)));
      (s.tags || []).forEach((t) => node.append(el("span", "tag", fill(tr(t, lang), vars))));
    }
    return node;
  }));
  sheet.replaceChildren(...cells);
  sheet.classList.toggle("editing", editing);

  $("tips-title").textContent = L.tipsTitle;
  $("tips").replaceChildren(...R.tips.map(([label, text]) => {
    const li = el("li");
    li.append(el("b", null, label), document.createTextNode(" " + fill(text, vars)));
    return li;
  }));

  // Previous / next
  const idx = SEQUENCE.indexOf(r);
  const links = [];
  [[idx - 1, L.prev, "← "], [idx + 1, L.next, ""]].forEach(([j, label, arrow]) => {
    const other = SEQUENCE[j];
    if (!other) return;
    const a = el("button");
    a.type = "button";
    a.dataset.route = other.id;
    a.append(el("small", null, label), el("span", null, arrow + other[lang].title + (arrow ? "" : " →")));
    links.push(a);
  });
  $("pager").replaceChildren(...links);
  document.title = R.title + " · Rutekokeboka";
}

function render() {
  const L = UI[state.lang];
  renderChrome(L);
  const r = BY_ID[state.route];
  $("home").hidden = !!r;
  $("recipe").hidden = !r;
  $("page").classList.toggle("is-home", !r);
  if (r) renderRecipe(r, L); else renderHome(L);
}

/* ---------- start-up ---------- */
function routeFromHash() {
  let h = "";
  try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (e) {}
  if (h === "no" || h === "en") { state.lang = h; return "home"; }
  return BY_ID[h] ? h : "home";
}

const savedLang = load("rk-lang") || load("hveteboller-lang");
if (savedLang === "no" || savedLang === "en") state.lang = savedLang;
const savedSkin = load("rk-skin") || load("hveteboller-skin");
if (SKINS.includes(savedSkin)) {
  state.skin = savedSkin;
} else {
  const hostTheme = document.documentElement.getAttribute("data-theme");
  const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  state.skin = hostTheme === "dark" || (!hostTheme && systemDark) ? "dark" : "parchment";
}
state.seasonOpen = load("rk-season") === "1";
LAYOUT.forEach(({ cat }) => { state.collapsed[cat] = load("rk-collapsed-" + cat) === "1"; });
RECIPES.forEach((r) => {
  const saved = parseFloat(load("rk-f-" + r.id));
  if (saved >= MIN_F && saved <= MAX_F) state.f[r.id] = saved;
});
if (!state.f.hveteboller) {
  const oldBuns = parseInt(load("hveteboller-buns"), 10);
  if (oldBuns >= 1 && oldBuns <= 200) state.f.hveteboller = oldBuns / 20;
}
RECIPES.forEach((r) => (r.options || []).forEach((o) => {
  const g = parseInt(load("rk-g-" + r.id + "-" + o.key), 10);
  if (g >= 0 && g < o.levels.length) state.grade[r.id + ":" + o.key] = g;
}));
try { EDITS = cleanEdits(JSON.parse(load("rk-edits") || "{}")); } catch (e) { EDITS = {}; }
state.route = routeFromHash();

let homeScroll = 0;
function show(route) {
  if (state.route === "home") homeScroll = window.scrollY;
  state.route = route;
  $("edit-status").textContent = "";
  render();
  const y = route === "home" ? homeScroll : 0;
  window.scrollTo(0, y);
  if (y) requestAnimationFrame(() => window.scrollTo(0, y));  // after the cards have been laid out
}
function go(route) {
  const next = BY_ID[route] ? route : "home";
  if (next === state.route) { window.scrollTo(0, 0); return; }
  show(next);
  const url = next === "home" ? location.pathname + location.search : "#" + next;
  try { history.pushState({ route: next }, "", url); }
  catch (err) { try { location.hash = next === "home" ? "" : next; } catch (e2) {} }
}
// Browser back/forward
window.addEventListener("popstate", () => {
  const route = routeFromHash();
  if (route !== state.route) show(route);
});
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-route]");
  if (!target) return;
  e.preventDefault();
  go(target.dataset.route);
});

window.addEventListener("hashchange", () => {
  const route = routeFromHash();
  if (route !== state.route) show(route);
});

document.querySelectorAll("button[data-lang]").forEach((b) => {
  b.addEventListener("click", () => {
    state.lang = b.dataset.lang;
    save("rk-lang", state.lang);
    render();
  });
});
document.querySelectorAll("button[data-skin]").forEach((b) => {
  b.addEventListener("click", () => {
    state.skin = b.dataset.skin;
    save("rk-skin", state.skin);
    render();
  });
});

function current() { return BY_ID[state.route]; }

$("batch-minus").addEventListener("click", () => {
  const r = current(); if (!r) return;
  const step = r.yield.step, n = countOf(r, factorOf(r));
  if (n > step) setFactor(r, (n - (n % step || step)) / r.yield.base);
});
$("batch-plus").addEventListener("click", () => {
  const r = current(); if (!r) return;
  const step = r.yield.step, n = countOf(r, factorOf(r));
  setFactor(r, (n + (step - (n % step))) / r.yield.base);
});
$("batch-reset").addEventListener("click", () => { const r = current(); if (r) setFactor(r, 1); });

$("batch-n").addEventListener("input", (e) => {
  const r = current(); if (!r) return;
  const v = parseInt(e.target.value, 10);
  if (v >= 1 && v <= r.yield.base * MAX_F) setFactor(r, v / r.yield.base);
});
$("batch-f").addEventListener("input", (e) => {
  const r = current(); if (!r) return;
  const v = parseFloat(e.target.value.replace(",", "."));
  if (v >= MIN_F && v <= MAX_F) setFactor(r, v);
});
["change", "blur"].forEach((type) => {
  $("batch-n").addEventListener(type, render);
  $("batch-f").addEventListener(type, () => {
    const r = current();
    if (r) $("batch-f").value = fmtFactor(factorOf(r), UI[state.lang]);
  });
});
$("batch-f").addEventListener("keydown", (e) => {
  if (e.key === "Enter") e.target.blur();
});

/* ---------- edit mode ---------- */
function setStatus(text) { $("edit-status").textContent = text || ""; }
$("edit-toggle").addEventListener("click", () => {
  if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.edit) document.activeElement.blur();
  state.editing = !state.editing;
  setStatus("");
  render();
});
function currentEdit(r, key) {
  const E = EDITS[r.id] || {};
  return E[key] != null ? E[key] : baseValue(r, key);
}
function revertEdit(node) {
  const r = current(); if (!r) return;
  const v = currentEdit(r, node.dataset.edit);
  if (node.dataset.edit.endsWith(".amt")) node.value = dec(Math.round(v / parseFloat(node.dataset.scale) * 100) / 100, UI[state.lang]);
  else if (v != null) node.textContent = v;
}
function commitEdit(node) {
  const r = current(); if (!r || !node.dataset.edit) return;
  const key = node.dataset.edit;
  let value;
  if (key.endsWith(".amt")) {
    const v = parseFloat(String(node.value).replace(",", "."));
    if (!(v >= 0)) { revertEdit(node); return; }
    value = Math.round(v * parseFloat(node.dataset.scale) * 1000) / 1000;
  } else {
    value = node.textContent.replace(/\s+/g, " ").trim();
    if (!value) { revertEdit(node); return; }
  }
  setEdit(r, key, value === baseValue(r, key) ? null : value);
  node.closest(".c").classList.toggle("is-edited", !!EDITS[r.id] && Object.keys(EDITS[r.id]).some((k) => k.split(".")[0] === key.split(".")[0] && (k.endsWith(".amt") === key.endsWith(".amt"))));
  $("edit-reset").disabled = !EDITS[r.id];
}
$("sheet").addEventListener("focusout", (e) => { if (e.target.dataset && e.target.dataset.edit) commitEdit(e.target); });
$("sheet").addEventListener("change", (e) => { if (e.target.dataset && e.target.dataset.edit) commitEdit(e.target); });
$("sheet").addEventListener("keydown", (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.edit) return;
  if (e.key === "Enter") { e.preventDefault(); t.blur(); }
  if (e.key === "Escape") { e.preventDefault(); revertEdit(t); t.blur(); }
});

// Export: through the viewer's save prompt on claude.ai, a normal download elsewhere.
let downloads = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then((d) => { downloads = d; }).catch(() => {});
}
$("edit-export").addEventListener("click", async () => {
  const L = UI[state.lang];
  const data = JSON.stringify({ format: EDIT_FORMAT, version: 1, exported: new Date().toISOString(), edits: EDITS }, null, 2);
  const filename = "rutekokeboka-endringer.json";
  if (downloads) {
    try { await downloads.save({ filename, data }); setStatus(L.exported); }
    catch (err) { setStatus(err && err.code === "declined" ? "" : L.exportFail); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = el("a");
    a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus(L.exported);
  } catch (err) { setStatus(L.exportFail); }
});
$("edit-import").addEventListener("click", () => $("edit-file").click());
$("edit-file").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const L = UI[state.lang];
    let obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (err) {}
    const incoming = cleanEdits(obj && obj.format === EDIT_FORMAT ? obj.edits : null);
    const k = Object.keys(incoming).length;
    if (!k) { setStatus(L.importBad); return; }
    Object.assign(EDITS, incoming);   // recipes in the file replace their earlier edits
    saveEdits();
    render();
    setStatus(fill(L.imported, { k: String(k) }));
  };
  reader.readAsText(file);
});
$("edit-reset").addEventListener("click", () => {
  const r = current(); if (!r) return;
  delete EDITS[r.id];
  saveEdits();
  render();
  setStatus(UI[state.lang].resetDone);
});

render();
</script>
